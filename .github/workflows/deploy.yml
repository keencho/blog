name: 배포

on:
  push:
    branches: [main]
  # 글 저장소를 분리하면 거기서 이 워크플로를 부른다
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

# GitHub Pages 로 올리는 데 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 올리는 중에 또 올리지 않는다. 다만 진행 중인 배포는 끝까지 둔다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 글 저장소를 분리하면 이 단계를 켠다
      # - uses: actions/checkout@v4
      #   with:
      #     repository: keencho/blog-content
      #     path: content
      #     token: ${{ secrets.CONTENT_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 다이어그램 SVG 는 저장소에 들어 있다.
      # 빠진 게 있을 때만 Chromium 을 받는다
      - name: 다이어그램 확인
        id: diagrams
        run: |
          if node scripts/diagrams.mjs --check 2>/dev/null; then
            echo "need_browser=false" >> "$GITHUB_OUTPUT"
          else
            echo "need_browser=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Chromium 설치 (필요할 때만)
        if: steps.diagrams.outputs.need_browser == 'true'
        run: npx playwright install --with-deps chromium

      - name: 다이어그램 굽기
        if: steps.diagrams.outputs.need_browser == 'true'
        run: npm run diagrams

      # 글에 쓰인 글자만 담아 본문 글꼴을 굽는다 (3.2MB 조각 92개 → 157KB 하나)
      - name: 글꼴 굽기
        run: node scripts/fonts.mjs

      - run: npx astro build
      - run: npx pagefind --site dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Cloudflare 가 아니라 GitHub Pages 로 올린다.
  # 한국에서 Cloudflare 무료·Pro·Business 는 서울(ICN) 엣지를 못 쓰고
  # 해외(LAX)로 돌아간다. 실측 TTFB 0.94초 → GitHub Pages 0.019초.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
